<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conjugador de Verbos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concepto: una mesa de trabajo de gramática. Cabecera de tinta marino con el buscador como protagonista; las formas irregulares son lo único cálido de la página. */
:root{
 --bg:#F2F5F9;--surface:#FFFFFF;--ink:#14213A;--muted:#5A6B82;--line:#DCE3EC;--soft:#EAF0F6;
 --hero:#1B2A41;--hero-ink:#FFFFFF;--hero-muted:#A9B8CE;--hero-field:#FFFFFF;--hero-field-ink:#14213A;
 --teal:#0F766E;--teal-bg:#E1F3F0;--irr:#B45309;--irr-bg:#FFE7C2;--orto:#1D4ED8;--orto-bg:#E4EEFC;--vos:#0F766E;
 --shadow:0 1px 2px rgba(20,33,58,.06),0 6px 20px rgba(20,33,58,.06);
 --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B1322;--surface:#131E33;--ink:#E8EEF7;--muted:#97A7BF;--line:#24314B;--soft:#1A2740;
 --hero:#0F1A2E;--hero-ink:#F2F6FC;--hero-muted:#8EA0BA;--hero-field:#1A2842;--hero-field-ink:#F2F6FC;
 --teal:#4FD1C5;--teal-bg:#12312F;--irr:#F5B66B;--irr-bg:#3B2A12;--orto:#8FB4FF;--orto-bg:#17284A;--vos:#4FD1C5;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0B1322;--surface:#131E33;--ink:#E8EEF7;--muted:#97A7BF;--line:#24314B;--soft:#1A2740;
 --hero:#0F1A2E;--hero-ink:#F2F6FC;--hero-muted:#8EA0BA;--hero-field:#1A2842;--hero-field-ink:#F2F6FC;
 --teal:#4FD1C5;--teal-bg:#12312F;--irr:#F5B66B;--irr-bg:#3B2A12;--orto:#8FB4FF;--orto-bg:#17284A;--vos:#4FD1C5;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:20}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 34px}
.hero .wrap{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 18px/1 var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--teal);color:#fff;font:700 15px/1 var(--display);font-style:normal}
.tools{display:flex;gap:8px}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--hero-ink);border-radius:999px;padding:6px 12px;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.08)}
.hero h1{font:700 clamp(28px,5vw,46px)/1.05 var(--display);margin:0;letter-spacing:-.01em;max-width:22ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:#7FE0D6}
.hero p.sub{margin:0;color:var(--hero-muted);max-width:60ch}
.search{position:relative;max-width:640px}
.search form{display:flex;gap:8px}
#q{flex:1;min-width:0;font:500 18px/1.2 var(--body);padding:15px 18px;border-radius:12px;border:2px solid transparent;background:var(--hero-field);color:var(--hero-field-ink)}
#q::placeholder{color:#7a8aa3}
#q:focus{outline:none;border-color:#7FE0D6}
.go{border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:600;padding:0 22px}
:root[data-theme="dark"] .go{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#06201e}}
#sugg{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
#sugg li{display:flex;justify-content:space-between;align-items:baseline;padding:9px 12px;border-radius:8px;cursor:pointer}
#sugg li small{color:var(--muted)}
#sugg li[aria-selected="true"]{background:var(--soft)}
#sugg li.none{cursor:default;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lbl,.lbl{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted)}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--hero-ink);border-radius:999px;padding:6px 13px;font-size:14px}
.chip:hover{background:rgba(255,255,255,.14)}
.msg{margin:0;padding:10px 14px;border-radius:10px;font-size:14px;background:var(--irr-bg);color:var(--irr)}
/* verbo */
main{padding-block:26px 40px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.vh{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:grid;gap:20px;margin-top:-30px;position:relative}
.vtop{display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:end}
#inf{font:700 clamp(40px,8vw,76px)/1 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
#badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{font:600 12px/1 var(--body);letter-spacing:.05em;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.badge.b2{background:var(--teal-bg);color:var(--teal)}.badge.b3{background:var(--irr-bg);color:var(--irr)}.badge.b4{background:var(--orto-bg);color:var(--orto)}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--soft);border-radius:12px;padding:10px 16px;min-width:130px}
.fact span{display:block;font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fact b{font:600 20px/1.1 var(--display)}
.fact.small b{font-size:17px}
.fact .alt{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.meterbox{display:grid;gap:8px}
#meter{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.seg.r{background:var(--line)}.seg.o{background:var(--orto)}.seg.i{background:var(--irr)}
#meterText{font-size:14px;color:var(--muted)}#meterText b{color:var(--irr)}#meterText b.blue{color:var(--orto)}
.note{font-size:14px;color:var(--muted);margin:0;padding:10px 14px;background:var(--soft);border-radius:10px}
.note b{color:var(--ink)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.tog::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--muted)}
.tog[aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.tog[aria-pressed="true"]::before{background:var(--teal);border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal-bg)}
.tog:disabled{opacity:.4;cursor:not-allowed}
/* pestañas */
#tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font:600 15px/1 var(--body);color:var(--muted);margin-bottom:-1px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
#tabs button:hover{color:var(--ink)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px 10px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;border-bottom:2px solid var(--ink)}
.card h3{margin:0;font:700 17px/1.2 var(--display)}
.card h3 small{display:block;font:500 12px/1.3 var(--body);color:var(--muted)}
.icon{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:grid}
.icon:hover{background:var(--soft);color:var(--ink)}.icon.ok{color:var(--teal)}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:grid;grid-template-columns:minmax(80px,38%) 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.card li:last-child{border-bottom:0}
.card .p{font-size:12px;color:var(--muted);line-height:1.25}
.card .f{font:500 16.5px/1.3 var(--body);overflow-wrap:anywhere}
.pr{color:var(--muted)}
.irr{color:var(--irr);font-weight:600}
.irr mark{background:var(--irr-bg);color:inherit;border-radius:4px;padding:0 2px;font-weight:700}
.orto{color:var(--orto);text-decoration:underline dotted;text-underline-offset:4px}
.vos{color:var(--vos);font-weight:600}
li.v .p{color:var(--vos);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend .l1::before{background:var(--irr)}.legend .l2::before{background:var(--orto)}.legend .l3::before{background:var(--vos)}
.msg.info{background:var(--teal-bg);color:var(--teal)}
.msg.info b{color:inherit}
.mchip{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 2px 0 0}
.mchip:hover{background:rgba(127,127,127,.12)}
#sugg li small{margin-left:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.ptrad{margin:12px 0 0;font-size:15px;color:var(--muted)}
.ptrad .ptl{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;margin-right:6px}
.ptrad b{color:var(--ink);font-weight:600}
.ptrad.none b{color:var(--muted);font-weight:400;font-style:italic}
.card li.def{opacity:.38}
.card li.def .f{text-decoration:line-through;text-decoration-color:var(--muted);text-decoration-thickness:1px}
.legend .l4::before{background:var(--muted);opacity:.4}
/* práctica */
.qcfg{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.qrow{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.qrow>.lbl{min-width:70px;margin:0!important}
.qsel{display:flex;gap:8px;flex-wrap:wrap}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;background:var(--surface)}
.tc:has(input:checked){background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.tc input{accent-color:var(--teal);margin:0}
.btn.sm{padding:7px 14px;font-size:14px}
.practice{grid-template-columns:minmax(0,1fr);min-width:0}
.quiz{grid-template-columns:minmax(0,1fr)}
#qa{width:100%}
.qcfg select{max-width:100%;min-width:0}
.qsel{min-width:0;max-width:100%}
@media (max-width:640px){.qrow>.lbl{min-width:0;width:100%}.qsel,.qsel select{width:100%}}
.practice{display:grid;gap:18px;max-width:760px}
.seg-ctl{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;justify-self:start}
.seg-ctl button{border:0;background:none;padding:9px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.practice .lbl{color:var(--muted);display:block;margin-bottom:6px}
.ptop{display:flex;gap:28px;flex-wrap:wrap;align-items:end}
.pv{font:700 26px/1 var(--display)}
select,.practice input[type=text],.prow input,#qa{font:500 16px/1.2 var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prows{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(110px,34%) 1fr 28px minmax(80px,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.prow label{font-size:13px;color:var(--muted)}
.prow input{width:100%;min-width:0}
.prow.ok{border-color:var(--teal);background:var(--teal-bg)}.prow.bad{border-color:var(--irr);background:var(--irr-bg)}
.prow .res{font-weight:700;text-align:center}.prow.ok .res{color:var(--teal)}.prow.bad .res{color:var(--irr)}
.prow .sol{font-weight:600;color:var(--ink)}
.pact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 20px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--ink)}
.score{font:700 18px var(--display);color:var(--teal);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--soft);border-radius:12px;padding:12px 14px}
.stats b{display:block;font:700 24px/1.1 var(--display)}.stats span{font-size:12px;color:var(--muted)}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:12px;text-align:center;justify-items:center;box-shadow:var(--shadow)}
.qv{font:700 clamp(36px,8vw,60px)/1 var(--display)}
.qt{color:var(--muted)}.qt b{color:var(--ink)}
#qf{display:flex;gap:8px;width:100%;max-width:440px;margin-top:6px}
#qa{flex:1;min-width:0;font-size:18px;text-align:center}
.fb{min-height:28px;font:600 18px var(--body)}.fb.ok{color:var(--teal)}.fb.bad{color:var(--irr)}
footer{font-size:13px;color:var(--muted);padding-block:6px 36px;border-top:1px solid var(--line);margin-top:10px;padding-top:18px}
@media (max-width:640px){
 .vtop{grid-template-columns:1fr}.fact{flex:1;min-width:0}.vh{padding:18px}
 .prow{grid-template-columns:1fr 28px;grid-template-areas:"l l""i r""s s"}.prow label{grid-area:l}.prow input{grid-area:i}.prow .res{grid-area:r}.prow .sol{grid-area:s}
 .hero h1{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
 <div class="top"><div class="brand"><i>ñ</i>Conjugador de verbos</div><div class="tools"><button class="tbtn" id="lang">PT</button><button class="tbtn" id="theme" aria-label="Cambiar entre tema claro y oscuro" data-l10n="theme">Claro / oscuro</button></div></div>
 <h1 data-l10n="h1">Todas las formas de un verbo, <em>con lo irregular a la vista</em></h1>
 <p class="sub" data-l10n="sub"></p>
 <div class="search">
  <form id="sf" role="search"><input id="q" type="text" placeholder="Un verbo o una forma: salir, dormirse, tengo…" aria-label="Verbo o forma conjugada" autocomplete="off" autocapitalize="off" spellcheck="false" aria-controls="sugg"><button class="go" type="submit" data-l10n="go">Conjugar</button></form>
  <ul id="sugg" role="listbox" hidden></ul>
 </div>
 <p class="msg" id="msg" hidden></p>
 <div class="chips" id="exrow"><span class="lbl" data-l10n="try">Prueba con</span><span class="chips" id="ex"></span><button class="chip" id="rnd" data-l10n="rnd">Verbo al azar</button></div>
 <div class="chips" id="recent"></div>
</div></header>
<div class="wrap"><main>
 <section class="vh" aria-live="polite">
  <div class="vtop">
   <div><h2 id="inf" style="margin:0"></h2><div id="badges"></div><p class="ptrad" id="ptrad"><span class="ptl" data-l10n="pt">En portugués</span> <b></b></p></div>
   <div class="facts"><div class="fact"><span data-l10n="ger">Gerundio</span><b id="ger"></b></div><div class="fact"><span data-l10n="part">Participio</span><b id="part"></b><small id="partvar" class="alt" hidden><span data-l10n="or">o</span> <b></b></small></div></div>
  </div>
  <div class="meterbox"><div id="meter" role="img" aria-label="Proporción de formas regulares e irregulares"></div><div id="meterText"></div></div>
  <p class="note" id="defnote" hidden><b data-l10n="defLbl">Uso limitado.</b> <span></span></p>
  <p class="note" id="variantes" hidden><b data-l10n="varLbl">Variantes aceptadas.</b> <span></span></p>
  <p class="note" id="pronote" hidden><b data-l10n="pronLbl">Verbo pronominal.</b> <span></span></p>
  <p class="note" id="estimado" hidden><b data-l10n="estLbl">Conjugación estimada.</b> <span data-l10n="estTxt"></span></p>
  <div class="opts"><button class="tog" id="reflBtn" aria-pressed="false"><span data-l10n="refl">Forma reflexiva (-se)</span></button><button class="tog" id="vosBtn" aria-pressed="false"><span data-l10n="vos">Mostrar voseo</span></button></div>
 </section>
 <div><div id="tabs" role="tablist" aria-label="Modos y tiempos"></div></div>
 <div id="panel" class="grid"></div>
 <div class="legend" aria-label="Leyenda de colores"><span class="l1" data-l10n="legend1"></span><span class="l2" data-l10n="legend2"></span><span class="l3" data-l10n="legend3"></span><span class="l4" data-l10n="legend4"></span></div>
 <footer data-l10n="footer"></footer>

/* ---------- análisis de regularidad ---------- */
function analyse(){
  const inf=state.inf, rec=state.rec;
  const m0=C.conjugate(inf,rec,false), rg=C.regular(inf);
  const cls={};let irr=0,ort=0;
  TENSES.filter(t=>t.exp).forEach(t=>{
    const f=t.get(m0),e=t.exp(rg);
    cls[t.id]=f.map((x,i)=>C.classify(x,e[i]));
  });
  const imp=m0.imperativo.afirmativo, expImp=['-',rg.ind[2],rg.sp[2],rg.sp[3],inf.slice(0,-1)+'d',rg.sp[5]];
  cls.iaf=imp.map((x,i)=>i===0?'reg':C.classify(x,expImp[i]));
  cls.ineg=['reg'].concat(m0.sp?[]:[]); cls.ineg=cls.spres.map((c,i)=>i===0?'reg':c);
  const gc=C.classify(m0.gerundio,rg.ger), pc=C.classify(m0.participio,rg.part);
  ['pres','pret','impf','fut','cond','spres'].forEach(id=>cls[id].forEach(c=>{if(c==='irr')irr++;if(c==='orto')ort++}));
  [gc,pc].forEach(c=>{if(c==='irr')irr++;if(c==='orto')ort++});
  return {m0,rg,cls,gc,pc,irr,ort,total:38};
}

/* ---------- formato de celdas ---------- */
function split(s){const m=s.match(PRONRE);return m?[m[1],s.slice(m[1].length)]:['',s]}
function diff(core,exp){
  let p=0;while(p<core.length&&p<exp.length&&core[p]===exp[p])p++;
  let s=0;while(s<core.length-p&&s<exp.length-p&&core[core.length-1-s]===exp[exp.length-1-s])s++;
  return [core.slice(0,p),core.slice(p,core.length-s),core.slice(core.length-s)];
}
function cell(display,base,expected,cl,markable){
  const [pre,core]=split(display);const [,core0]=split(base);
  const P=pre?`<span class="pr">${esc(pre)}</span>`:'';
  if(cl==='orto') return `${P}<span class="orto">${esc(core)}</span>`;
  if(cl==='irr'){
    if(markable&&core===core0&&expected){const [a,b,c]=diff(core,expected);return `${P}<span class="irr">${esc(a)}${b?`<mark>${esc(b)}</mark>`:''}${esc(c)}</span>`}
    return `${P}<span class="irr">${esc(core)}</span>`;
  }
  return P+esc(core);
}
function lastWordCell(display,cl){
  const [pre,core]=split(display);const i=core.lastIndexOf(' ');const aux=core.slice(0,i),w=core.slice(i+1);
  const P=pre?`<span class="pr">${esc(pre)}</span>`:'';
  const W=cl==='irr'?`<span class="irr">${esc(w)}</span>`:cl==='orto'?`<span class="orto">${esc(w)}</span>`:esc(w);
  return P+esc(aux)+' '+W;
}

    else if(t.id==='ineg'){const [pf]=split(f),[,core]=split(f);const e=A.rg.sp[i];const cl=A.cls.ineg[i];const [,b0]=split(base[i]);const pre=pf?`<span class="pr">${esc(pf)}</span>`:'';html=cl==='irr'?pre+`<span class="irr">${esc(core)}</span>`:cl==='orto'?pre+`<span class="orto">${esc(core)}</span>`:pre+esc(core)}
    else html=cell(f,base[i],exp[i],A.cls[t.id][i],true);

}

function suggest(q){
  const n=norm(q); if(!n){$('#sugg').hidden=true;return}
  const base=n.replace(/se$/,'');const isRefl=n.length>3&&n.endsWith('se')&&!!BYNORM[base];
  const items=[];const push=(v,refl,sub)=>{if(items.length<8&&!items.some(x=>x.v===v&&x.refl===refl))items.push({v,refl,sub})};
  if(BYNORM[n])push(BYNORM[n],false,'-'+C.typeOf(BYNORM[n]));
  if(isRefl)push(BYNORM[base],true,L('suggRefl'));
  const a=[],b=[];
  for(let i=0;i<KEYS.length;i++){const k=NKEYS[i];if(k.startsWith(n)||(n.endsWith('se')&&base.length>=2&&k.startsWith(base)))a.push(KEYS[i]);else if(n.length>=3&&k.includes(n))b.push(KEYS[i])}
  const byRank=(x,y)=>((RANK[x]??1e6)-(RANK[y]??1e6))||x.localeCompare(y,'es');
  a.sort(byRank);b.sort(byRank);
  if(!BYNORM[n]&&!isRefl&&n.length>=2) formHits(q).slice(0,4).forEach(x=>push(x.v,x.refl,x.f+' · '+x.lab));
  a.concat(b).forEach(k=>push(k,false,'-'+C.typeOf(k)));
  list=items;sel=list.length?0:-1;

  if(!list.length){ul.innerHTML=`<li class="none">${L('noSugg')}</li>`}
  else ul.innerHTML=list.map((x,i)=>`<li role="option" data-v="${esc(x.v)}" data-refl="${x.refl?1:''}" aria-selected="${i===sel}"><b>${esc(x.v+(x.refl?'se':''))}</b><small>${esc(x.sub)}</small></li>`).join('');
  ul.hidden=false;
}

function vosP(v,r){if(v==='ser')return 'sos';if(v==='haber')return 'has';return r[5][4].replace(/([aeáé])is$/,(x,c)=>c+'s')}
function vosI(v){const sp={ir:'andá',ser:'sé',ver:'ve'};if(sp[v])return sp[v];let w=v.slice(0,-1);if(!/[áéíóú]$/.test(w))w=accentLast(w);return w}
function formList(v){
  const r=DB[v],L=[];
  r[5].forEach((f,i)=>L.push([f,IND_N[Math.floor(i/6)]+' de indicativo ('+PERS_F[i%6]+')',false]));
  r[6].forEach((f,i)=>L.push([f,'presente de subjuntivo ('+PERS_F[i]+')',false]));
  r[7].forEach((f,i)=>L.push([f,'imperfecto de subjuntivo ('+PERS_F[i]+')',false]));
  C.sraToSse(r[7]).forEach((f,i)=>L.push([f,'imperfecto de subjuntivo en -se ('+PERS_F[i]+')',false]));
  r[8].forEach((f,i)=>L.push([f,'imperativo ('+IMP_F[i]+')',false]));
  r[10].forEach((f,i)=>L.push([f,'imperativo ('+IMP_F[i]+')',true]));
  L.push([r[0],'gerundio',false],[r[1],'participio',false],[r[9],'gerundio',true],[vosP(v,r),'presente (vos)',false],[vosI(v),'imperativo (vos)',false]);

function formStrings(){
  if(FSTR)return FSTR;FSTR={};

function formHits(q){

  const k='|'+C.stripA(t)+'|',S=formStrings(),raw=[];
  for(const v of KEYS){if(S[v].indexOf(k)<0)continue;
    formList(v).forEach(([f,lab,refl])=>{if(C.stripA(f)===C.stripA(t))raw.push({v,f,lab,refl})})}
  const exact=raw.filter(h=>h.f===t),res=exact.length?exact:raw;
  res.sort((a,b)=>((RANK[a.v]??1e6)-(RANK[b.v]??1e6))||a.v.localeCompare(b.v,'es'));
  const g=[];
  res.forEach(h=>{let x=g.find(y=>y.v===h.v&&y.refl===h.refl);if(!x){x={v:h.v,refl:h.refl,f:h.f,labs:[]};g.push(x)}if(!x.labs.includes(h.lab))x.labs.push(h.lab)});

  if(c.set==='este')return [state.inf];
  if(c.set==='irr')return POOL.filter(v=>!/^Sin cambio/.test(DB[v][3]));
  if(c.set==='grupo'){const L=PK.R.filter(v=>DB[v]&&DB[v][3]===c.grp).slice(0,300);return L.length?L:KEYS.filter(v=>DB[v][3]===c.grp)}
  return POOL;
}
function mkQ(v,tid,idx){
  const rec=DB[v]||(v===state.inf?state.rec:null);if(!rec)return null;
  const t=TENSES.find(x=>x.id===tid),f=t.get(C.conjugate(v,rec,false));
  if(idx==null){const ok=[0,1,2,3,4,5].filter(i=>f[i]&&f[i]!=='-'&&(P.cfg.vosotros||i!==4));idx=pick(ok)}
  return {v,t,idx,ans:f[idx],done:false,val:''};
}
function newQ(){
  const c=P.cfg;
  if(c.set==='errores'){if(!P.errs.length){P.q=null;return}const e=pick(P.errs);P.q=mkQ(e.v,e.t,e.i)||null;return}
  const vs=qVerbs().filter(v=>DB[v]||v===state.inf);const ts=c.tenses.length?c.tenses:['pres'];
  P.q=vs.length?mkQ(pick(vs),pick(ts)):null;
}
function qCfgHTML(){
  const c=P.cfg;
  const sets=[['frec',L('setFrec')],['irr',L('setIrr')],['grupo',L('setGrp')],['este',L('setEste',{v:state.inf})],['errores',L('setErr',{n:P.errs.length})]];
  return `<div class="qcfg">
   <div class="qrow"><label class="lbl" for="qset">${L('verbos')}</label><div class="qsel"><select id="qset">${sets.map(([k,n])=>`<option value="${k}" ${c.set===k?'selected':''}>${esc(n)}</option>`).join('')}</select>
   <select id="qgrp" ${c.set==='grupo'?'':'hidden'}>${GROUPS.map(g=>`<option ${g===c.grp?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div>
   <div class="qrow"><span class="lbl">${L('tiempos')}</span><div class="tchips">${QT.map(([id])=>`<label class="tc"><input type="checkbox" data-qt="${id}" ${c.tenses.includes(id)?'checked':''}>${esc(L('qt_'+id))}</label>`).join('')}</div></div>
   <div class="qrow"><label class="chk"><input type="checkbox" id="qvos" ${c.vosotros?'checked':''}> ${L('inclVos')}</label>${P.errs.length?'<button class="btn ghost sm" id="qclr">'+L('clrErr')+'</button>':''}</div>
  </div>`;
}
function renderRapido(){
  if(!P.q)newQ();const q=P.q,s=P.stats;
  const stats=`<div class="stats"><div><b>${s.streak}</b><span>${L('streak')}</span></div><div><b>${s.best}</b><span>${L('best')}</span></div><div><b>${s.total?Math.round(100*s.ok/s.total):0}%</b><span>${L('hits')} (${s.ok}/${s.total})</span></div></div>`;
  if(!q){$('#pbody').innerHTML=qCfgHTML()+stats+`<div class="quiz"><div class="qt">${P.cfg.set==='errores'?L('noErr'):L('noVerbs')}</div></div>`;return}
  const pn=q.t.imp?['','tú','usted','nosotros','vosotros','ustedes'][q.idx]:PERS[q.idx];
  const grp=q.t.group==='indicativo'?'Indicativo · ':q.t.group==='subjuntivo'?'Subjuntivo · ':q.t.group==='imperativo'?'Imperativo ':'';
  $('#pbody').innerHTML=qCfgHTML()+stats+`
  <div class="quiz"><div class="qv">${esc(q.v)}</div><div class="qt">${esc(grp)}${esc(q.t.name)} · <b>${esc(pn)}</b></div>
  <form id="qf" autocomplete="off"><input id="qa" aria-label="Tu respuesta" autocapitalize="off" spellcheck="false" ${q.done?'disabled':''} value="${esc(q.val)}" placeholder="${L('typeForm')}"><button class="btn" type="submit">${q.done?L('next'):L('check')}</button></form>
  <div class="fb ${q.done?(q.ok?'ok':'bad'):''}" aria-live="polite">${q.done?(q.ok?L('ok'):L('was',{a:esc(q.ans)})):''}</div>
  ${q.done&&!q.ok?`<button class="btn ghost sm" data-goto="${esc(q.v)}">${L('goto',{v:esc(q.v)})}</button>`:''}
  ${P.cfg.set==='errores'&&!q.done?'<div class="qt">'+L('errLeft',{n:P.errs.length})+'</div>':''}</div>`;
  const qa=$('#qa');if(qa&&!q.done)qa.focus();
}
function answerQ(){
  const q=P.q;if(!q){newQ();renderRapido();return}
  if(q.done){newQ();renderRapido();return}
  const val=$('#qa').value;if(!val.trim())return;
  q.val=val;q.done=true;q.ok=eq(val,q.ans);const s=P.stats;s.total++;
  const key=e=>e.v===q.v&&e.t===q.t.id&&e.i===q.idx;
  if(q.ok){s.ok++;s.streak++;s.best=Math.max(s.best,s.streak);P.errs=P.errs.filter(e=>!key(e))}
  else{s.streak=0;if(!P.errs.some(key))P.errs.push({v:q.v,t:q.t.id,i:q.idx});if(P.errs.length>200)P.errs.shift()}
  store.set('cv-stats',s);saveErrs();renderRapido();
  const b=$('#qf button');if(b)b.focus();
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='qset'){P.cfg.set=t.value;saveCfg();newQ();renderRapido()}
  else if(t.id==='qgrp'){P.cfg.grp=t.value;saveCfg();newQ();renderRapido()}
  else if(t.dataset&&t.dataset.qt){const id=t.dataset.qt;P.cfg.tenses=t.checked?P.cfg.tenses.concat(id):P.cfg.tenses.filter(x=>x!==id);saveCfg();newQ();renderRapido()}
  else if(t.id==='qvos'){P.cfg.vosotros=t.checked;saveCfg();newQ();renderRapido()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-goto],#qclr');if(!b)return;
  if(b.id==='qclr'){P.errs=[];saveErrs();if(P.cfg.set==='errores')newQ();renderRapido();return}
  setVerb(b.dataset.goto,false);state.tab='indicativo';renderTab();window.scrollTo({top:0,behavior:'smooth'});
});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,li[data-v]');if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;renderTab();return}
  if(t.dataset.v){const v=t.dataset.v;const refl=t.dataset.refl==='1';setVerb(v,refl);if(t.classList.contains('chip')&&/se$/.test(t.textContent))return;return}
  if(t.dataset.copy){const tn=TENSES.find(x=>x.id===t.dataset.copy);const rows=tenseView(tn,model());copyText(tn.name+' · '+state.inf+'\n'+rows.map(r=>r.p+'\t'+r.text).join('\n'),t);return}
  if(t.id==='reflBtn'){if(state.est||DB[state.inf]){state.refl=!state.refl;A=analyse();renderHeader();renderTab()}return}
  if(t.id==='vosBtn'){state.vos=!state.vos;store.set('cv-vos',state.vos);renderHeader();renderTab();return}
  if(t.id==='rnd'){const v=POOL[Math.floor(Math.random()*POOL.length)];setVerb(v,false);return}
  if(t.id==='lang'){LANG=LANG==='pt'?'es':'pt';store.set('cv-lang',LANG);applyLang();renderHeader();renderTab();renderRecent();if(!$('#msg').hidden&&$('#msg').classList.contains('info'))$('#msg').hidden=true;return}
  if(t.id==='theme'){const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';store.set('cv-theme',d.dataset.theme);return}
  if(t.dataset.mode){P.mode=t.dataset.mode;renderPractice();return}
  if(t.id==='check'){P.checked=true;renderTabla();return}
  if(t.id==='reveal'){P.show=!P.show;renderTabla();return}
  if(t.id==='clear'){Object.keys(P.answers).forEach(k=>{if(k.startsWith(P.tense+':'))delete P.answers[k]});P.checked=false;P.show=false;renderTabla();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){navigated=false;clearTimeout(window.__sg);const v=t.value;window.__sg=setTimeout(()=>suggest(v),90)}
  else if(t.dataset&&t.dataset.i!==undefined&&t.closest('.prows')){P.answers[P.tense+':'+t.dataset.i]=t.value}
  else if(t.id==='noacc'){state.noAccent=t.checked;store.set('cv-noacc',t.checked)}
});
document.addEventListener('change',e=>{if(e.target.id==='tsel'){P.tense=e.target.value;P.checked=false;P.show=false;renderTabla()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='sf')submit();else if(e.target.id==='qf')answerQ()});
document.addEventListener('keydown',e=>{
  if(e.target.id==='q'){
    if(e.key==='ArrowDown'&&list.length){e.preventDefault();navigated=true;sel=(sel+1)%list.length;$$('#sugg li').forEach((li,i)=>li.setAttribute('aria-selected',i===sel))}
    else if(e.key==='ArrowUp'&&list.length){e.preventDefault();navigated=true;sel=(sel-1+list.length)%list.length;$$('#sugg li').forEach((li,i)=>li.setAttribute('aria-selected',i===sel))}
    else if(e.key==='Escape'){$('#sugg').hidden=true}
  } else if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  else if(e.target.closest&&e.target.closest('#tabs')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const ids=TABS.map(x=>x[0]);let i=ids.indexOf(state.tab)+(e.key==='ArrowRight'?1:-1);i=(i+ids.length)%ids.length;state.tab=ids[i];renderTab();const b=$(`#tabs [data-tab="${ids[i]}"]`);if(b)b.focus()}
});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.search'))$('#sugg').hidden=true});
document.addEventListener('mousedown',e=>{const li=e.target.closest('#sugg li[data-v]');if(li){e.preventDefault();const q=$('#q').value.trim().toLowerCase();setVerb(li.dataset.v,li.dataset.refl==='1');const hs=li.dataset.refl!=null?formHits(q).filter(x=>x.v===li.dataset.v):[];if(hs.length&&norm(q)!==norm(li.dataset.v))showFormMsg(q,hs)}});

/* ---------- inicio ---------- */
(function init(){
  const th=store.get('cv-theme',null);if(th)document.documentElement.dataset.theme=th;
  applyLang();
  $('#ex').innerHTML=['ser','tener','pensar','dormirse','jugar','freír','construir','haber'].map(v=>{const r=v.endsWith('se');return `<button class="chip" data-v="${r?v.slice(0,-2):v}" ${r?'data-refl="1"':''}>${v}</button>`}).join('');
  setVerb('salir',false);
})();
// chips reflexivos
document.addEventListener('click',e=>{const c=e.target.closest('.chip[data-refl]');if(c){state.refl=true;A=analyse();renderHeader();renderTab()}},true);
})();
</script>

</body>
